<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero Comercial — Café Mariscal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f2f1ec;color:#1a1a1a}

  header{background:#1a1a1a;color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
  header .brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:.5rem}
  header .brand .dot{width:9px;height:9px;border-radius:50%;background:#8B6200}
  header .periodo{font-size:12.5px;color:#c9c9c9}

  #wrap{max-width:1200px;margin:0 auto;padding:1.25rem}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.9rem;margin-bottom:1.25rem}
  .kpi{background:#fff;border:1px solid #e3e2db;border-radius:12px;padding:1rem 1.1rem}
  .kpi .n{font-size:26px;font-weight:700;color:#1a6ec4}
  .kpi .l{font-size:12px;color:#777;margin-top:2px;text-transform:uppercase;letter-spacing:.04em}

  .panel{background:#fff;border:1px solid #e3e2db;border-radius:14px;padding:1.1rem 1.25rem;margin-bottom:1.25rem}
  .panel h3{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:#555;margin-bottom:.9rem;display:flex;align-items:center;justify-content:space-between}
  .hint{font-size:11.5px;color:#999;font-weight:400;text-transform:none;letter-spacing:0}

  .f-group{display:flex;flex-direction:column;gap:3px}
  .f-group label{font-size:10px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em}
  .f-group input{font-size:14px;padding:8px 10px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a}
  .f-group input:focus{outline:none;border-color:#1a6ec4}
  #reset-fechas-btn{padding:8px 14px;border:1px solid #ccc;border-radius:8px;background:#f8f8f8;font-size:13px;cursor:pointer;height:37px}
  #reset-fechas-btn:active{background:#eee}

  /* Tabs */
  #tabs{display:flex;gap:.4rem;max-width:1200px;margin:1rem auto 0;padding:0 1.25rem}
  .tab-btn{padding:9px 18px;border:1px solid #e3e2db;border-bottom:none;border-radius:10px 10px 0 0;background:#e9e8e1;color:#666;font-size:13.5px;font-weight:600;cursor:pointer}
  .tab-btn.active{background:#f2f1ec;color:#1a1a1a}
  .tab-btn:hover{color:#1a1a1a}

  .tab-content{display:none}
  .tab-content.active{display:block}

  /* Mapa */
  #map{height:560px;border-radius:12px;border:1px solid #e3e2db}
  .map-filters{display:flex;gap:.7rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:.9rem}
  .map-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:.8rem}
  .map-leg-item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#555;cursor:pointer;padding:3px 8px;border-radius:12px;border:1px solid #eee}
  .map-leg-item.off{opacity:.35}
  .map-leg-dot{width:11px;height:11px;border-radius:50%}
  .leaflet-popup-content{font-size:13px}
  .popup-title{font-weight:700;margin-bottom:3px}
  .popup-row{font-size:12px;color:#444;margin-top:1px}

  #chart-wrap{height:260px}

  #detalle-vacio{color:#999;font-size:13.5px;text-align:center;padding:2rem 0}

  .sel-vendedor{background:#f0f7ff;border:1px solid #c8e0ff;color:#1a4a8a;font-weight:700;padding:5px 12px;border-radius:20px;font-size:13px;display:inline-flex;align-items:center;gap:8px}
  .sel-vendedor button{background:none;border:none;color:#1a4a8a;cursor:pointer;font-size:13px;font-weight:700}

  .refs-filter{display:flex;flex-wrap:wrap;gap:6px;margin:.75rem 0 1rem}
  .ref-chip{font-size:11.5px;padding:4px 10px;border-radius:14px;border:1px solid #ddd;background:#fafafa;color:#555;cursor:pointer;user-select:none;white-space:nowrap}
  .ref-chip.on{background:#1a6ec4;border-color:#1a6ec4;color:#fff}
  .refs-actions{display:flex;gap:8px;margin-bottom:.5rem}
  .refs-actions button{font-size:11.5px;padding:4px 10px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:8px 10px;background:#f7f7f2;color:#555;font-weight:600;position:sticky;top:0;white-space:nowrap}
  td{padding:7px 10px;border-bottom:1px solid #f0f0eb;white-space:nowrap}
  tr:hover td{background:#fafaf5}
  .table-scroll{overflow-x:auto;max-height:420px;overflow-y:auto;border:1px solid #eee;border-radius:8px}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .cliente-cell{font-weight:600}
  .zero{color:#ccc}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>☕ Café Mariscal — Tablero comercial</div>
  <div class="periodo" id="periodo-label">Café Mariscal — histórico completo</div>
</header>

<div id="tabs">
  <button class="tab-btn active" id="tab-btn-resumen" onclick="cambiarTab('resumen')">📊 Resumen</button>
  <button class="tab-btn" id="tab-btn-mapa" onclick="cambiarTab('mapa')">🗺️ Mapa de rutas</button>
</div>

<div id="wrap">

  <div class="panel" id="panel-fechas" style="margin-bottom:1.25rem">
    <h3>Rango de fechas <span class="hint" id="rango-hint"></span></h3>
    <div style="display:flex;gap:.75rem;flex-wrap:wrap;align-items:flex-end">
      <div class="f-group">
        <label for="f-desde">Desde</label>
        <input type="date" id="f-desde">
      </div>
      <div class="f-group">
        <label for="f-hasta">Hasta</label>
        <input type="date" id="f-hasta">
      </div>
      <button id="reset-fechas-btn" onclick="resetFechas()">Ver todo</button>
    </div>
  </div>

  <div class="tab-content active" id="tab-resumen">

    <div class="kpis" id="kpis"></div>

    <div class="panel">
      <h3>Visitas por vendedor <span class="hint">clic en una barra para ver el detalle</span></h3>
      <div id="chart-wrap"><canvas id="chart-vendedores"></canvas></div>
    </div>

    <div class="panel">
      <h3>
        <span>Clientes visitados <span id="vendedor-actual"></span></span>
      </h3>
      <div id="detalle-vacio">Selecciona un vendedor en el gráfico de arriba para ver sus clientes e inventarios.</div>
      <div id="detalle-contenido" style="display:none">
        <div class="refs-actions">
          <button onclick="marcarTodasRefs(true)">Ver todas las referencias</button>
          <button onclick="marcarTodasRefs(false)">Ocultar todas</button>
        </div>
        <div class="refs-filter" id="refs-filter"></div>
        <div class="table-scroll">
          <table>
            <thead><tr id="tabla-head"></tr></thead>
            <tbody id="tabla-body"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <div class="tab-content" id="tab-mapa">
    <div class="panel">
      <h3>Ruta en el mapa <span class="hint" id="mapa-count-label"></span></h3>
      <div class="map-filters">
        <div class="f-group">
          <label for="map-f-vendedor">Vendedor</label>
          <select id="map-f-vendedor"><option value="">Todos</option></select>
        </div>
        <div class="f-group">
          <label for="map-f-dia">Día de la semana</label>
          <select id="map-f-dia"><option value="">Todos</option></select>
        </div>
      </div>
      <div id="map"></div>
      <div class="map-legend" id="map-legend"></div>
    </div>
  </div>

</div>

L INST LIOFILIZADO 85 GRMS": 0, "CAFE MARISCAL INST LIOFILIZADO 170GR": 0, "CAFE MARISCAL GRAN EDICION ESPECIAL 100 GRMS": 0, "20G INST SACH POL MAR": 0, "500g INST/POLVO MARISCAL": 0, "500g INST/GRAN MARISCAL": 0}}]};
const REFS = RAW.refs;
const VISITAS = RAW.visitas;

// ---- Colores de vendedor: fijos según el universo COMPLETO de datos, ----
// para que no cambien de color al filtrar por fecha.
const vendedoresTodos = [...new Set(VISITAS.map(v => v.vendedor))];
const PALETA = ['#1a6ec4','#c0392b','#2d7a2d','#8B6200','#8e44ad','#e67e22','#16a085','#c2185b'];
const colorVendedor = {};
vendedoresTodos.forEach((v, i) => colorVendedor[v] = PALETA[i % PALETA.length]);

// ---- Filtro de fecha ----
const fechasDisponibles = [...new Set(VISITAS.map(v => v.fecha))].sort();
const fechaMin = fechasDisponibles[0];
const fechaMax = fechasDisponibles[fechasDisponibles.length - 1];
document.getElementById('f-desde').min = fechaMin;
document.getElementById('f-desde').max = fechaMax;
document.getElementById('f-hasta').min = fechaMin;
document.getElementById('f-hasta').max = fechaMax;
document.getElementById('f-desde').value = fechaMin;
document.getElementById('f-hasta').value = fechaMax;

let VISITAS_FILTRADAS = VISITAS;

function resetFechas() {
  document.getElementById('f-desde').value = fechaMin;
  document.getElementById('f-hasta').value = fechaMax;
  aplicarFiltroFecha();
}

function aplicarFiltroFecha() {
  const desde = document.getElementById('f-desde').value;
  const hasta = document.getElementById('f-hasta').value;
  VISITAS_FILTRADAS = VISITAS.filter(v => v.fecha >= desde && v.fecha <= hasta);

  const rangoHint = document.getElementById('rango-hint');
  rangoHint.textContent = (desde === fechaMin && hasta === fechaMax)
    ? 'todo el histórico (' + fechaMin + ' a ' + fechaMax + ')'
    : desde + ' a ' + hasta;

  actualizarKPIs();
  actualizarChart();

  // si el vendedor seleccionado ya no tiene visitas en el rango, se limpia la selección
  if (vendedorActivo && !VISITAS_FILTRADAS.some(v => v.vendedor === vendedorActivo)) {
    limpiarSeleccion();
  } else if (vendedorActivo) {
    renderRefsFilter();
    renderTabla();
  }

  actualizarMapa();
}

document.getElementById('f-desde').addEventListener('change', aplicarFiltroFecha);
document.getElementById('f-hasta').addEventListener('change', aplicarFiltroFecha);

// ---- KPIs ----
function kpiCard(n, l) {
  const d = document.createElement('div');
  d.className = 'kpi';
  d.innerHTML = '<div class="n">' + n + '</div><div class="l">' + l + '</div>';
  return d;
}
function actualizarKPIs() {
  const vendedoresSet = [...new Set(VISITAS_FILTRADAS.map(v => v.vendedor))];
  const clientesSet = [...new Set(VISITAS_FILTRADAS.map(v => v.cliente))];
  let unidadesTotales = 0;
  VISITAS_FILTRADAS.forEach(v => REFS.forEach(r => unidadesTotales += (v.refs[r] || 0)));

  const kpisEl = document.getElementById('kpis');
  kpisEl.innerHTML = '';
  kpisEl.appendChild(kpiCard(VISITAS_FILTRADAS.length, 'Visitas registradas'));
  kpisEl.appendChild(kpiCard(vendedoresSet.length, 'Vendedores activos'));
  kpisEl.appendChild(kpiCard(clientesSet.length, 'Clientes visitados'));
  kpisEl.appendChild(kpiCard(unidadesTotales.toLocaleString('es-CO'), 'Unidades registradas'));
}

// ---- Gráfico: visitas por vendedor ----
let chart = null;
function actualizarChart() {
  const conteoPorVendedor = {};
  vendedoresTodos.forEach(v => conteoPorVendedor[v] = 0);
  VISITAS_FILTRADAS.forEach(v => conteoPorVendedor[v.vendedor]++);

  const vendedoresOrdenados = vendedoresTodos
    .filter(v => conteoPorVendedor[v] > 0)
    .sort((a, b) => conteoPorVendedor[b] - conteoPorVendedor[a]);

  if (!chart) {
    const ctx = document.getElementById('chart-vendedores');
    chart = new Chart(ctx, {
      type: 'bar',
      data: { labels: [], datasets: [{ data: [], backgroundColor: [], borderRadius: 6, maxBarThickness: 60 }] },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
        onClick: (evt, elements) => {
          if (!elements.length) return;
          const idx = elements[0].index;
          seleccionarVendedor(chart.data.labels[idx]);
        },
        onHover: (evt, elements) => {
          evt.native.target.style.cursor = elements.length ? 'pointer' : 'default';
        }
      }
    });
  }

  chart.data.labels = vendedoresOrdenados;
  chart.data.datasets[0].data = vendedoresOrdenados.map(v => conteoPorVendedor[v]);
  chart.data.datasets[0].backgroundColor = vendedoresOrdenados.map(v => colorVendedor[v]);
  chart.update();

  return vendedoresOrdenados;
}

// ---- Detalle por vendedor ----
let vendedorActivo = null;
let refsActivas = new Set(); // referencias visibles en la tabla

function seleccionarVendedor(vendedor) {
  vendedorActivo = vendedor;
  refsIniciadas = false; // nuevo vendedor: se vuelve a inicializar el set de referencias visibles
  document.getElementById('detalle-vacio').style.display = 'none';
  document.getElementById('detalle-contenido').style.display = 'block';
  document.getElementById('vendedor-actual').innerHTML =
    '<span class="sel-vendedor" style="background:' + colorVendedor[vendedor] + '22;color:' + colorVendedor[vendedor] + ';border-color:' + colorVendedor[vendedor] + '55">' +
    vendedor + ' <button onclick="limpiarSeleccion()">✕</button></span>';

  renderRefsFilter();
  renderTabla();
}

function limpiarSeleccion() {
  vendedorActivo = null;
  document.getElementById('detalle-vacio').style.display = 'block';
  document.getElementById('detalle-contenido').style.display = 'none';
  document.getElementById('vendedor-actual').innerHTML = '';
}

let refsIniciadas = false; // controla si ya se hizo la carga inicial de chips para el vendedor activo

function renderRefsFilter() {
  const cont = document.getElementById('refs-filter');
  cont.innerHTML = '';
  // referencias que tuvieron al menos 1 unidad para este vendedor en el rango filtrado
  const clientesDelVendedor = VISITAS_FILTRADAS.filter(v => v.vendedor === vendedorActivo);
  const refsConDatos = REFS.filter(r => clientesDelVendedor.some(v => (v.refs[r] || 0) > 0));
  const refsMostrar = refsConDatos.length ? refsConDatos : REFS;

  // Solo se inicializa (marcar todas activas) la primera vez que se selecciona
  // este vendedor. Después, "Ocultar todas" puede dejar el set realmente vacío
  // sin que se vuelva a rellenar solo.
  if (!refsIniciadas) {
    refsActivas = new Set(refsMostrar);
    refsIniciadas = true;
  }

  refsMostrar.forEach(ref => {
    const chip = document.createElement('span');
    chip.className = 'ref-chip' + (refsActivas.has(ref) ? ' on' : '');
    chip.textContent = ref;
    chip.onclick = () => {
      if (refsActivas.has(ref)) refsActivas.delete(ref); else refsActivas.add(ref);
      chip.classList.toggle('on');
      renderTabla();
    };
    cont.appendChild(chip);
  });
}

function marcarTodasRefs(mostrar) {
  const clientesDelVendedor = VISITAS_FILTRADAS.filter(v => v.vendedor === vendedorActivo);
  const refsConDatos = REFS.filter(r => clientesDelVendedor.some(v => (v.refs[r] || 0) > 0));
  const refsMostrar = refsConDatos.length ? refsConDatos : REFS;
  refsActivas = new Set(mostrar ? refsMostrar : []);
  refsIniciadas = true; // acción explícita del usuario: no se debe volver a autorellenar
  renderRefsFilter();
  renderTabla();
}

function renderTabla() {
  const thead = document.getElementById('tabla-head');
  const tbody = document.getElementById('tabla-body');
  thead.innerHTML = '';
  tbody.innerHTML = '';

  const refsCols = REFS.filter(r => refsActivas.has(r));

  const headCliente = document.createElement('th'); headCliente.textContent = 'Cliente';
  const headPunto = document.createElement('th'); headPunto.textContent = 'Punto de venta';
  const headCanal = document.createElement('th'); headCanal.textContent = 'Canal';
  const headFecha = document.createElement('th'); headFecha.textContent = 'Fecha';
  thead.appendChild(headCliente); thead.appendChild(headPunto); thead.appendChild(headCanal); thead.appendChild(headFecha);
  refsCols.forEach(r => {
    const th = document.createElement('th'); th.textContent = r; th.className = 'num';
    thead.appendChild(th);
  });

  const filas = VISITAS_FILTRADAS.filter(v => v.vendedor === vendedorActivo);
  if (!filas.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 4 + refsCols.length;
    td.textContent = 'Sin visitas registradas en el rango seleccionado para este vendedor.';
    td.style.textAlign = 'center'; td.style.color = '#999';
    tr.appendChild(td); tbody.appendChild(tr);
    return;
  }

  filas.forEach(v => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="cliente-cell">' + v.cliente + '</td>' +
      '<td>' + v.punto + '</td>' +
      '<td>' + v.canal + '</td>' +
      '<td>' + v.fecha + '</td>';
    refsCols.forEach(r => {
      const val = v.refs[r] || 0;
      const td = document.createElement('td');
      td.className = 'num' + (val === 0 ? ' zero' : '');
      td.textContent = val;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  // ---- Fila de totales ----
  const trTotal = document.createElement('tr');
  trTotal.style.fontWeight = '700';
  trTotal.style.background = '#f7f7f2';
  trTotal.style.borderTop = '2px solid #ddd';
  trTotal.innerHTML =
    '<td class="cliente-cell">TOTAL (' + filas.length + ' visita' + (filas.length !== 1 ? 's' : '') + ')</td>' +
    '<td></td><td></td><td></td>';
  refsCols.forEach(r => {
    const total = filas.reduce((acc, v) => acc + (v.refs[r] || 0), 0);
    const td = document.createElement('td');
    td.className = 'num';
    td.textContent = total.toLocaleString('es-CO');
    trTotal.appendChild(td);
  });
  tbody.appendChild(trTotal);
}

// Carga inicial: aplica el filtro de fecha (semana completa por defecto),
// dibuja KPIs y gráfico, y selecciona automáticamente el vendedor con más visitas.
const ordenInicial = actualizarChart();
actualizarKPIs();
document.getElementById('rango-hint').textContent = 'todo el histórico (' + fechaMin + ' a ' + fechaMax + ')';
if (ordenInicial.length) seleccionarVendedor(ordenInicial[0]);

function cambiarTab(nombre) {
  document.getElementById('tab-resumen').classList.toggle('active', nombre === 'resumen');
  document.getElementById('tab-mapa').classList.toggle('active', nombre === 'mapa');
  document.getElementById('tab-btn-resumen').classList.toggle('active', nombre === 'resumen');
  document.getElementById('tab-btn-mapa').classList.toggle('active', nombre === 'mapa');

  if (nombre === 'mapa') {
    if (!mapaInicializado) inicializarMapa();
    // Leaflet necesita recalcular tamaño cuando el contenedor estaba oculto
    setTimeout(() => map && map.invalidateSize(), 50);
    actualizarMapa();
  }
}

// =========================================================================
// MAPA DE RUTAS (comparte el filtro de fecha de arriba; filtro propio de
// vendedor y día de la semana)
// =========================================================================
let map = null;
let mapaInicializado = false;
let mapMarkers = []; // {marker, data}

const ORDEN_DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

function inicializarMapa() {
  mapaInicializado = true;

  map = L.map('map').setView([4.815, -75.71], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  // Poblar selects propios del mapa
  const selVend = document.getElementById('map-f-vendedor');
  vendedoresTodos.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    selVend.appendChild(opt);
  });
  const diasConDatos = ORDEN_DIAS.filter(d => VISITAS.some(v => v.dia === d));
  const selDia = document.getElementById('map-f-dia');
  diasConDatos.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    selDia.appendChild(opt);
  });

  selVend.addEventListener('change', actualizarMapa);
  selDia.addEventListener('change', actualizarMapa);

  // Crear un marcador por cada visita con GPS válido (se filtran/ocultan dinámicamente)
  VISITAS.filter(v => v.lat && v.lng).forEach(v => {
    const color = colorVendedor[v.vendedor] || '#1a6ec4';
    const icon = L.divIcon({
      className: '',
      html: '<div style="width:15px;height:15px;border-radius:50%;background:' + color + ';border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)"></div>',
      iconSize: [15, 15],
      iconAnchor: [7, 7]
    });
    const marker = L.marker([v.lat, v.lng], { icon: icon });
    marker.bindTooltip(
      '<b>' + v.cliente + '</b><br>' + v.punto + '<br>🕐 ' + (v.hora || 'sin hora'),
      { direction: 'top', offset: [0, -8] }
    );
    marker.bindPopup(
      '<div class="popup-title">' + v.cliente + '</div>' +
      '<div class="popup-row"><b>Punto:</b> ' + v.punto + '</div>' +
      '<div class="popup-row"><b>Vendedor:</b> ' + v.vendedor + '</div>' +
      '<div class="popup-row"><b>Fecha:</b> ' + v.fecha + ' (' + v.dia + ')</div>' +
      '<div class="popup-row"><b>Hora:</b> ' + (v.hora || 'sin hora') + '</div>' +
      '<div class="popup-row"><b>Canal:</b> ' + v.canal + '</div>'
    );
    mapMarkers.push({ marker: marker, data: v });
  });

  renderMapaLeyenda();
}

const mapaOcultos = new Set(); // vendedores ocultos manualmente desde la leyenda del mapa

function renderMapaLeyenda() {
  const cont = document.getElementById('map-legend');
  cont.innerHTML = '';
  vendedoresTodos.forEach(v => {
    const item = document.createElement('div');
    item.className = 'map-leg-item' + (mapaOcultos.has(v) ? ' off' : '');
    item.innerHTML = '<span class="map-leg-dot" style="background:' + colorVendedor[v] + '"></span>' + v;
    item.onclick = () => {
      if (mapaOcultos.has(v)) mapaOcultos.delete(v); else mapaOcultos.add(v);
      renderMapaLeyenda();
      actualizarMapa();
    };
    cont.appendChild(item);
  });
}

function actualizarMapa() {
  if (!mapaInicializado) return;

  const vendedorSel = document.getElementById('map-f-vendedor').value;
  const diaSel = document.getElementById('map-f-dia').value;
  const fechasFiltradas = new Set(VISITAS_FILTRADAS.map(v => v.fecha));

  let visibles = 0;
  mapMarkers.forEach(({ marker, data }) => {
    let ok = true;
    if (!fechasFiltradas.has(data.fecha)) ok = false;
    if (mapaOcultos.has(data.vendedor)) ok = false;
    if (vendedorSel && data.vendedor !== vendedorSel) ok = false;
    if (diaSel && data.dia !== diaSel) ok = false;

    if (ok) {
      if (!map.hasLayer(marker)) marker.addTo(map);
      visibles++;
    } else {
      if (map.hasLayer(marker)) map.removeLayer(marker);
    }
  });

  document.getElementById('mapa-count-label').textContent = visibles + ' punto' + (visibles !== 1 ? 's' : '') + ' visibles en el rango seleccionado';
}
</script>
